name: Build ByteProof Windows Installer

# macOS DMGs are built locally on the release machine so they can be signed
# and notarized with the Apple Developer ID. This workflow handles the Windows
# build in parallel and attaches it to the GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm ByteProof_win.spec
      - name: Create distribution zip
        shell: pwsh
        run: Compress-Archive -Path dist\ByteProof\* -DestinationPath ByteProof_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ByteProof-Windows
          path: ByteProof_Windows.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ByteProof_Windows.zip
