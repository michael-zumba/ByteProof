name: Test and build ByteProof

# Every push and pull request runs the test suite on both platforms; tagged
# builds additionally produce the Windows installers. A tag whose version does
# not match src/settings.py is rejected before anything is published.
#
# macOS DMGs are built locally on the release machine so they can be signed
# and notarized with the Apple Developer ID.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS is the release gate: it runs the whole suite and the tagged build
  # waits for it.
  test:
    name: Tests (macos-14)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Check version consistency
        run: python scripts/check_version.py
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Run tests
        # One process per test file: Qt objects are freed by Python's garbage
        # collector, so a window from one file can be collected while a later
        # file builds its own, which intermittently segfaults on macOS.
        #
        # scripts/run_tests_ci.py keeps a wedged test from stalling the job: it
        # streams the child's output, kills the process tree when a file stops
        # making progress, and reports which file it was.
        timeout-minutes: 12
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          BYTEPROOF_CI_PROGRESS: "1"
        shell: bash
        run: python scripts/run_tests_ci.py tests/test_*.py

  # The same suite on Windows, for information. It is deliberately not a
  # release gate: when a Windows test blocks, the hosted runner stops
  # reporting altogether - job, step and even cancellation timers do not land -
  # so a gate there can hold a finished release hostage for an hour. Anything
  # the Windows build itself needs to be correct is still gated by the
  # packaging job below, which fails loudly.
  test-windows:
    name: Tests (windows-latest, informational)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Check version consistency
        run: python scripts/check_version.py
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Run tests
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
          BYTEPROOF_CI_PROGRESS: "1"
          # Shorter than macOS: a wedged Windows runner costs the whole job.
          BYTEPROOF_TEST_LIMIT_S: "90"
        shell: bash
        run: python scripts/run_tests_ci.py tests/test_*.py

  windows:
    name: Windows installer (x64)
    # Only build installers for tags, and only after the macOS suite passes.
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify tag matches APP_VERSION
        shell: pwsh
        run: python scripts/check_version.py --tag "${{ github.ref_name }}"
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm ByteProof_win.spec
      - name: Create distribution zip
        shell: pwsh
        run: Compress-Archive -Path dist\ByteProof\* -DestinationPath ByteProof_Windows.zip -Force
      - name: Build MSIX package for Microsoft Store
        shell: pwsh
        run: ./packaging/windows/build-msix.ps1 -AppDir dist\ByteProof -ConfigPath packaging\windows\msix-config.json -AssetsDir packaging\windows\Assets -Output ByteProof_Installer_x64.msix
      - name: Publish checksums
        shell: pwsh
        run: |
          Get-FileHash ByteProof_Windows.zip -Algorithm SHA256 | Format-List
          Get-FileHash ByteProof_Installer_x64.msix -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: ByteProof-Windows
          path: |
            ByteProof_Windows.zip
            ByteProof_Installer_x64.msix
          if-no-files-found: warn
      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ByteProof_Windows.zip
      - name: Attach MSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('ByteProof_Installer_x64.msix') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ByteProof_Installer_x64.msix
