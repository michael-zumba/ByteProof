name: Build ByteProof Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm ByteProof_win.spec
      - name: Create distribution zip
        shell: pwsh
        run: Compress-Archive -Path dist\ByteProof\* -DestinationPath ByteProof_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ByteProof-Windows
          path: ByteProof_Windows.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ByteProof_Windows.zip

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm ByteProof.spec
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DMG
        run: |
          create-dmg \
            --volname "ByteProof Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ByteProof.app" 200 190 \
            --hide-extension "ByteProof.app" \
            --app-drop-link 400 185 \
            ByteProof_Installer_AppleSilicon.dmg \
            "dist/ByteProof.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ByteProof-macOS-AppleSilicon
          path: ByteProof_Installer_AppleSilicon.dmg
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ByteProof_Installer_AppleSilicon.dmg

  macos-intel:
    name: macOS Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm ByteProof_intel.spec
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DMG
        run: |
          create-dmg \
            --volname "ByteProof Installer (Intel)" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ByteProof.app" 200 190 \
            --hide-extension "ByteProof.app" \
            --app-drop-link 400 185 \
            ByteProof_Installer_Intel.dmg \
            "dist/ByteProof.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ByteProof-macOS-Intel
          path: ByteProof_Installer_Intel.dmg
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ByteProof_Installer_Intel.dmg
